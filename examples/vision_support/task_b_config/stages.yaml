# Use the workload command to copy this YAML into a fresh fixture directory.
model_name_or_path: base
data_mode: fixture
manifest_path: data/train/manifest.json
dev_manifest_path: data/dev/manifest.json
backend: hf
quantization_mode: none
compute_dtype: fp32
gradient_checkpointing: standard
max_length: 256
batch_size: 1
gradient_accumulation_steps: 2
save_steps: 2
packing: false
template_policy:
  stop_tokens: ['<|im_end|>']
stages:
  - name: mixed_cpt
    objective: causal_text
    init_adapter: new
    sources: [chat, notes]
    target_loss_token_share: {chat: 0.35, notes: 0.65}
    lr: 0.003
    max_steps: 4
    token_budget: 2048
    warmup_steps: 0
    seed: 71
    output_dir: runs/cpt_seed71
  - name: dialogue_sft
    objective: assistant_only_messages
    init_adapter: continue_stage
    parent: stage:mixed_cpt
    sources: [dyadic_chat]
    supervise_target_eos: true
    lr: 0.002
    max_steps: 4
    token_budget: 2048
    warmup_steps: 0
    seed: 72
    output_dir: runs/sft_seed72
    dev_probe: true
    dev_every: 2
